<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Details | Book Club Bliss</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Open+Sans&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/book.DqvENCCm.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/styles.2Y5MNT98.js">
    <link rel="modulepreload" crossorigin href="/assets/api.DABdBofW.js">
    <link rel="stylesheet" crossorigin href="/assets/styles.C3MvUMMk.css">
  </head>

  <body>
    <header class="site-header">
      <h1>Book Club Bliss</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="club.html">My Club</a></li>
        </ul>
      </nav>
    </header>

    <main id="book-details">
      <section class="book-info">
        <h2 id="book-title">Loading...</h2>
        <p><strong>Author:</strong> <span id="book-author"></span></p>
        <img id="book-cover" src="" alt="Book Cover" />
        <p id="book-description"></p>
      </section>

      <section class="actions">
        <button id="markReading">Mark as Reading</button>
        <button id="markFinished">Mark as Finished</button>
        <button id="addTimeline">Add to Timeline</button>
      </section>

      <section class="discussion">
        <h3>Discussion</h3>
        <div id="discussionBoard"></div>
        <form id="commentForm">
          <textarea
            placeholder="Write your comment here..."
            required
          ></textarea>
          <button type="submit">Post Comment</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2025 📚 Book Club Bliss 📚</p>
    </footer>

  </body>
</html>
